name: 01-webflux-compose

services:
  postgres:
    image: postgres:17
    container_name: marketplace-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: webflux-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # R2DBC
      SPRING_R2DBC_URL: ${DB_R2DBC_URL}
      SPRING_R2DBC_USERNAME: ${DB_USERNAME}
      SPRING_R2DBC_PASSWORD: ${DB_PASSWORD}

      # Flyway (JDBC)
      SPRING_FLYWAY_URL: ${DB_JDBC_URL}
      SPRING_FLYWAY_USER: ${DB_USERNAME}
      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD}
    networks:
      - backend-net

  simulator:
    build: python-user-registers
    container_name: register-users-python
    depends_on:
      - backend
    networks:
      - backend-net

volumes:
  pgdata:

networks:
  backend-net:
